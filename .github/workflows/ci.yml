# 타입체크 + 단위테스트. 이 레포에는 로그인이 없고 자금이 움직이는 코드가
# 대부분이라, CI가 붙잡을 수 있는 건 순수 로직뿐이다 — 거래소 왕복은 RUNBOOK의
# DRY-RUN 리허설이 계속 담당한다. 여기 있는 것들이라도 회귀를 막는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 개발 머신(Node 24 / npm 11)과 맞춘다 — npm 11이 만든 lockfile의
          # 중첩 ws@7 optional peer(utf-8-validate) 해석을 npm 10(Node 20)이
          # 못 읽어 npm ci가 EUSAGE로 죽었다. 런타임 불일치가 원인이므로
          # lockfile을 고치는 게 아니라 CI 노드를 맞춘다.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 비용 모델의 산식 점검 (기존 스크립트)
      - run: npm run check
